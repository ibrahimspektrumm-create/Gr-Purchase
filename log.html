<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GR Purchase — سجل النشاط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --void:#020408;--deep:#050B14;--surface:#080F1C;--raised:#0B1525;
  --card:#0E1B2E;--elevated:#121F35;--highlight:#16263E;
  --border-dim:#0D2040;--border:#133058;--border-mid:#1A4070;--border-hi:#1E5090;
  --cyan:#00D4FF;--cyan-hi:#33DEFF;--cyan-lo:#0099CC;
  --cyan-glow:rgba(0,212,255,0.18);--cyan-glass:rgba(0,212,255,0.05);
  --blue:#0070FF;--purple:#8B5CF6;--amber:#F59E0B;
  --green:#10B981;--green-dim:rgba(16,185,129,0.12);
  --red:#EF4444;--red-dim:rgba(239,68,68,0.12);
  --tx-hi:#E8F4FF;--tx-mid:#6B8EB5;--tx-lo:#2A4060;--tx-dim:#162030;
  --f-ui:'Cairo',sans-serif;--f-mono:'IBM Plex Mono',monospace;--f-display:'Orbitron',sans-serif;
  --sidebar-w:64px;--t-mid:0.22s cubic-bezier(0.4,0,0.2,1);--r-md:10px;--r-lg:16px;--r-xl:22px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:var(--f-ui);background:var(--void);color:var(--tx-hi);-webkit-font-smoothing:antialiased}
button{font-family:var(--f-ui);cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:var(--f-ui);outline:none;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--deep)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Background */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(0,212,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.025) 1px,transparent 1px);
  background-size:48px 48px;animation:gridDrift 80s linear infinite}
@keyframes gridDrift{100%{background-position:48px 48px}}
.bg-radial{position:absolute;inset:0;
  background:radial-gradient(ellipse 50% 40% at 20% 30%,rgba(0,112,255,0.05) 0%,transparent 70%),
             radial-gradient(ellipse 40% 30% at 80% 70%,rgba(139,92,246,0.04) 0%,transparent 70%)}

/* Layout */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh}

/* Sidebar */
.sidebar{display:flex;flex-direction:column;align-items:center;
  background:rgba(8,15,28,0.96);border-left:1px solid var(--border-dim);
  backdrop-filter:blur(20px);padding:12px 0 16px;gap:4px;position:relative;z-index:50}
.sidebar::before{content:'';position:absolute;top:0;right:-1px;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,var(--cyan-lo),var(--purple),transparent);opacity:0.4}
.s-logo{width:40px;height:40px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.s-logo svg{width:26px;height:26px;color:var(--cyan);filter:drop-shadow(0 0 8px var(--cyan))}
.s-div{width:30px;height:1px;background:linear-gradient(90deg,transparent,var(--border-mid),transparent);margin:4px 0}
.nav-btn{width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:var(--r-md);color:var(--tx-lo);transition:var(--t-mid);position:relative;cursor:pointer}
.nav-btn svg{width:17px;height:17px}
.nav-btn .nl{font-size:8px;font-family:var(--f-mono);letter-spacing:0.05em}
.nav-btn:hover{color:var(--cyan);background:rgba(0,212,255,0.05)}
.nav-btn.active{color:var(--cyan);background:linear-gradient(135deg,rgba(0,212,255,0.1),rgba(0,112,255,0.07));
  border:1px solid rgba(0,212,255,0.18)}
.nav-btn.active::before{content:'';position:absolute;right:-1px;top:25%;bottom:25%;
  width:2px;background:var(--cyan);border-radius:2px;box-shadow:0 0 8px var(--cyan)}
.nav-spacer{flex:1}
.branch-btn{width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:var(--r-md);background:linear-gradient(135deg,rgba(139,92,246,0.1),rgba(0,112,255,0.07));
  border:1px solid rgba(139,92,246,0.2);color:var(--purple);cursor:pointer;transition:var(--t-mid)}
.branch-btn:hover{background:linear-gradient(135deg,rgba(139,92,246,0.18),rgba(0,112,255,0.12))}
.bid{font-size:11px;font-family:var(--f-mono);font-weight:600}
.bdot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* Main */
.main{display:flex;flex-direction:column;overflow:hidden}

/* Header */
.page-header{
  padding:20px 28px 0;flex-shrink:0;
}
.ph-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.ph-title{display:flex;align-items:center;gap:14px}
.ph-icon{width:44px;height:44px;
  background:linear-gradient(135deg,rgba(0,212,255,0.12),rgba(0,112,255,0.08));
  border:1px solid rgba(0,212,255,0.2);border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center}
.ph-icon svg{width:20px;height:20px;color:var(--cyan)}
.ph-text h1{font-family:var(--f-display);font-size:16px;font-weight:700;color:var(--cyan);
  letter-spacing:0.12em;text-shadow:0 0 16px rgba(0,212,255,0.4)}
.ph-text p{font-size:12px;font-family:var(--f-mono);color:var(--tx-mid);margin-top:3px}
.ph-actions{display:flex;gap:8px;align-items:center}

/* Stat cards */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;padding:0 28px}
.stat-card{
  background:linear-gradient(135deg,rgba(14,27,46,0.9),rgba(8,15,28,0.95));
  border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 18px;display:flex;align-items:center;gap:14px;
  position:relative;overflow:hidden;
  transition:border-color var(--t-mid),box-shadow var(--t-mid);
}
.stat-card:hover{border-color:var(--border-mid);box-shadow:0 0 20px rgba(0,212,255,0.06)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--border-hi),transparent);opacity:0.5}
.sc-icon{width:40px;height:40px;border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sc-icon svg{width:18px;height:18px}
.sc-icon.cyan{background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.15);color:var(--cyan)}
.sc-icon.green{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.15);color:var(--green)}
.sc-icon.amber{background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.15);color:var(--amber)}
.sc-icon.red{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.15);color:var(--red)}
.sc-body{flex:1;min-width:0}
.sc-val{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--tx-hi);line-height:1}
.sc-lbl{font-size:11px;color:var(--tx-mid);margin-top:4px;font-family:var(--f-mono)}

/* Filter bar */
.filter-bar{
  display:flex;align-items:center;gap:10px;
  padding:0 28px 16px;flex-wrap:wrap;flex-shrink:0;
}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:340px}
.search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--tx-mid);pointer-events:none}
.search-icon svg{width:14px;height:14px}
.search-input{
  width:100%;height:36px;padding:0 36px 0 14px;
  background:rgba(0,212,255,0.03);border:1px solid var(--border);
  border-radius:var(--r-md);font-size:13px;color:var(--tx-hi);
  transition:var(--t-mid);
}
.search-input:focus{border-color:rgba(0,212,255,0.35);background:rgba(0,212,255,0.05);box-shadow:0 0 0 3px rgba(0,212,255,0.07)}
.filter-select{
  height:36px;padding:0 12px;
  background:rgba(0,212,255,0.03);border:1px solid var(--border);
  border-radius:var(--r-md);font-size:12px;color:var(--tx-mid);
  cursor:pointer;appearance:none;min-width:130px;
  transition:var(--t-mid);
}
.filter-select:focus{border-color:rgba(0,212,255,0.3);color:var(--tx-hi)}
.filter-select option{background:var(--card)}
.filter-btn{
  height:36px;padding:0 14px;
  border-radius:var(--r-md);font-size:12px;font-weight:500;
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--border);color:var(--tx-mid);
  transition:var(--t-mid);
}
.filter-btn svg{width:13px;height:13px}
.filter-btn:hover{border-color:var(--border-mid);color:var(--tx-hi);background:var(--raised)}
.filter-btn.active{border-color:rgba(0,212,255,0.35);color:var(--cyan);background:rgba(0,212,255,0.07)}
.filter-btn.primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#000;border-color:transparent;font-weight:600;box-shadow:0 0 16px rgba(0,212,255,0.2)}
.filter-btn.primary:hover{box-shadow:0 0 24px rgba(0,212,255,0.35)}
.filter-spacer{flex:1}
.record-count{font-size:11px;font-family:var(--f-mono);color:var(--tx-mid)}
.record-count span{color:var(--cyan)}

/* Table */
.table-wrap{
  flex:1;overflow:hidden;padding:0 28px 20px;
  display:flex;flex-direction:column;
}
.table-container{
  flex:1;overflow:auto;
  background:linear-gradient(160deg,rgba(14,27,46,0.95),rgba(8,15,28,0.98));
  border:1px solid var(--border);border-radius:var(--r-xl);
  position:relative;
}
.table-container::before{content:'';position:absolute;inset:-1px;border-radius:var(--r-xl);
  background:linear-gradient(135deg,rgba(0,212,255,0.06) 0%,transparent 40%,rgba(139,92,246,0.04) 100%);
  pointer-events:none;z-index:0}
table{width:100%;border-collapse:collapse;min-width:900px;position:relative;z-index:1}
thead{position:sticky;top:0;z-index:10}
thead tr{background:rgba(8,13,24,0.98);border-bottom:1px solid var(--border-mid)}
thead tr::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan-lo),transparent);opacity:0.4}
th{
  padding:13px 16px;text-align:right;
  font-size:10px;font-weight:600;color:var(--tx-mid);
  text-transform:uppercase;letter-spacing:0.08em;
  white-space:nowrap;cursor:pointer;user-select:none;
  transition:color var(--t-mid);
}
th:hover{color:var(--tx-hi)}
th.sort-asc::after{content:' ↑';color:var(--cyan)}
th.sort-desc::after{content:' ↓';color:var(--cyan)}
th:first-child{width:52px;text-align:center;cursor:default}
tbody tr{border-bottom:1px solid var(--border-dim);transition:background var(--t-mid)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(0,212,255,0.025)}
tbody tr.fade-in{animation:rowIn 0.2s ease}
@keyframes rowIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
td{padding:11px 16px;font-size:12px;color:var(--tx-hi);vertical-align:middle}
td:first-child{text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--tx-dim)}

/* Cell types */
.td-user{display:flex;align-items:center;gap:8px}
.user-avatar{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;flex-shrink:0;
}
.user-name{font-weight:500}
.td-action{display:flex;align-items:center;gap:7px}
.action-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.action-icon svg{width:12px;height:12px}
.td-sheet .sheet-chip{
  padding:3px 10px;border-radius:20px;font-size:11px;font-family:var(--f-mono);
  font-weight:500;white-space:nowrap;
}
.td-time{font-family:var(--f-mono);font-size:11px;color:var(--tx-mid);white-space:nowrap}
.td-time .date{display:block;font-size:10px;color:var(--tx-lo)}
.td-device{font-size:11px;font-family:var(--f-mono);color:var(--tx-mid)}
.status-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:20px;font-size:11px;font-family:var(--f-mono);
}
.status-badge.ok  {background:var(--green-dim);color:var(--green)}
.status-badge.fail{background:var(--red-dim);color:var(--red)}

/* Action type color mapping */
.act-edit{background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.15);color:var(--cyan)}
.act-add {background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.15);color:var(--green)}
.act-del {background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.15);color:var(--red)}
.act-imp {background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.15);color:var(--purple)}
.act-exp {background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.15);color:var(--amber)}
.act-sys {background:rgba(107,142,181,0.08);border:1px solid rgba(107,142,181,0.15);color:var(--tx-mid)}

/* Sheet chips */
.chip-purchases{background:rgba(0,212,255,0.08);color:var(--cyan);border:1px solid rgba(0,212,255,0.2)}
.chip-kasa     {background:rgba(16,185,129,0.08);color:var(--green);border:1px solid rgba(16,185,129,0.2)}
.chip-barcode  {background:rgba(139,92,246,0.08);color:var(--purple);border:1px solid rgba(139,92,246,0.2)}
.chip-phinex   {background:rgba(245,158,11,0.08);color:var(--amber);border:1px solid rgba(245,158,11,0.2)}
.chip-system   {background:rgba(107,142,181,0.08);color:var(--tx-mid);border:1px solid rgba(107,142,181,0.2)}

/* Empty state */
.empty-state{padding:80px 24px;text-align:center}
.es-icon{font-size:48px;margin-bottom:14px;opacity:0.25}
.es-title{font-size:16px;font-weight:600;color:var(--tx-mid);margin-bottom:6px}
.es-text{font-size:13px;color:var(--tx-lo)}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;
  border-top:1px solid var(--border-dim);flex-shrink:0;background:rgba(5,11,20,0.95)}
.pag-info{font-size:12px;font-family:var(--f-mono);color:var(--tx-mid)}
.pag-info span{color:var(--cyan)}
.pag-btns{display:flex;gap:6px}
.pag-btn{height:30px;min-width:30px;padding:0 8px;border-radius:6px;
  font-size:12px;font-family:var(--f-mono);border:1px solid var(--border);
  color:var(--tx-mid);transition:var(--t-mid);display:flex;align-items:center;justify-content:center}
.pag-btn:hover:not(:disabled){border-color:var(--border-mid);color:var(--tx-hi);background:var(--raised)}
.pag-btn.active{background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.35);color:var(--cyan)}
.pag-btn:disabled{opacity:0.3;cursor:default}

/* Toast */
.toast-host{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--elevated);
  border:1px solid var(--border);border-radius:var(--r-lg);font-size:13px;
  box-shadow:0 8px 40px rgba(0,0,0,0.6);animation:toastIn 0.25s ease;pointer-events:auto}
.toast.success{border-color:rgba(16,185,129,0.4)}.toast.error{border-color:rgba(239,68,68,0.4)}
.toast.info{border-color:rgba(0,212,255,0.3)}.toast.warn{border-color:rgba(245,158,11,0.4)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Log detail modal */
.modal-overlay{position:fixed;inset:0;z-index:900;background:rgba(2,4,8,0.85);
  backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity var(--t-mid)}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-win{background:linear-gradient(160deg,rgba(14,27,46,0.98),rgba(8,15,28,0.99));
  border:1px solid var(--border-mid);border-radius:var(--r-xl);padding:28px;
  min-width:460px;max-width:600px;width:90%;
  box-shadow:0 0 0 1px rgba(0,212,255,0.08),0 24px 60px rgba(0,0,0,0.8);
  transform:scale(0.96);transition:transform var(--t-mid)}
.modal-overlay.open .modal-win{transform:scale(1)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border-dim)}
.modal-title{font-family:var(--f-display);font-size:13px;font-weight:700;color:var(--cyan);letter-spacing:0.1em}
.modal-close{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--tx-mid);transition:var(--t-mid);cursor:pointer}
.modal-close:hover{background:var(--red-dim);color:var(--red)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.detail-item{background:rgba(0,212,255,0.03);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px}
.detail-item.full{grid-column:1/-1}
.di-label{font-size:10px;font-family:var(--f-mono);color:var(--tx-mid);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px}
.di-value{font-size:13px;color:var(--tx-hi);word-break:break-all}

@media(max-width:768px){
  :root{--sidebar-w:0px}.sidebar{display:none}
  .stat-row{grid-template-columns:1fr 1fr}
  .filter-bar{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="bg"><div class="bg-grid"></div><div class="bg-radial"></div></div>

<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="s-logo">
      <svg viewBox="0 0 32 32" fill="currentColor">
        <rect x="3" y="4" width="3" height="24" rx="1"/>
        <rect x="8" y="4" width="1.5" height="24" rx="0.5"/>
        <rect x="11.5" y="4" width="3" height="24" rx="1"/>
        <rect x="17" y="4" width="1" height="24" rx="0.5"/>
        <rect x="20" y="4" width="2.5" height="24" rx="1"/>
        <rect x="25" y="4" width="4" height="24" rx="1"/>
      </svg>
    </div>
    <div class="s-div"></div>
    <a href="app.html" class="nav-btn" title="الشيتات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span class="nl">WORK</span>
    </a>
    <button class="nav-btn active" title="سجل النشاط">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
      <span class="nl">LOG</span>
    </button>
    <a href="settings.html" class="nav-btn" title="الإعدادات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span class="nl">SET</span>
    </a>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-win">

<div class="toast-host" id="toastHost"></div>

<script>
/* ── DATA MODEL ── */
const LOG = {
  records: [],
  filtered: [],
  sortCol: 'timestamp',
  sortDir: 'desc',
  page: 1,
  perPage: 25,
};

const AVATARS = {
  'أحمد محمود':  { bg:'rgba(0,212,255,0.15)',  color:'#00D4FF', initials:'أح' },
  'سارة علي':    { bg:'rgba(139,92,246,0.15)', color:'#8B5CF6', initials:'سع' },
  'محمد خالد':   { bg:'rgba(16,185,129,0.15)', color:'#10B981', initials:'مخ' },
  'فاطمة حسن':   { bg:'rgba(245,158,11,0.15)', color:'#F59E0B', initials:'فح' },
  'عمر يوسف':    { bg:'rgba(239,68,68,0.15)',  color:'#EF4444', initials:'عي' },
};

const ACTION_META = {
  EDIT_CELL:      { label:'تعديل خلية',   cls:'act-edit', icon:'✎' },
  ADD_COLUMN:     { label:'إضافة عمود',   cls:'act-add',  icon:'+' },
  REMOVE_COLUMN:  { label:'حذف عمود',     cls:'act-del',  icon:'−' },
  UPDATE_COLUMN:  { label:'تعديل عمود',   cls:'act-edit', icon:'✎' },
  PASTE:          { label:'لصق',           cls:'act-imp',  icon:'⎘' },
  CLOSE_INVOICE:  { label:'إنهاء فاتورة', cls:'act-sys',  icon:'✓' },
  OPEN_INVOICE:   { label:'فتح فاتورة',   cls:'act-add',  icon:'◈' },
  REPLACE_ALL:    { label:'استبدال شامل', cls:'act-edit', icon:'⇄' },
  IMPORT:         { label:'استيراد',       cls:'act-imp',  icon:'↑' },
  EXPORT:         { label:'تصدير',         cls:'act-exp',  icon:'↓' },
  SAVE:           { label:'حفظ',           cls:'act-sys',  icon:'⬛' },
  LOGIN:          { label:'تسجيل دخول',   cls:'act-add',  icon:'→' },
  LOGOUT:         { label:'تسجيل خروج',   cls:'act-sys',  icon:'←' },
  SET_LINK:       { label:'إدراج رابط',   cls:'act-edit', icon:'🔗' },
  EDIT_CELL_LINK: { label:'تعديل رابط',   cls:'act-edit', icon:'🔗' },
};

const SHEET_CLS = {
  Purchases:'chip-purchases', Kasa:'chip-kasa',
  Barcode:'chip-barcode', Phinex:'chip-phinex', System:'chip-system',
};

const DEVICES = ['Chrome / Windows','Firefox / macOS','Safari / iPhone','Chrome / Android','Edge / Windows'];
const USERS   = Object.keys(AVATARS);

/* ── SEED DATA ── */
function seedData() {
  const actions = Object.keys(ACTION_META);
  const sheets  = ['Purchases','Kasa','Barcode','Phinex','System'];
  const details = [
    'تعديل خلية B12 — القيمة الجديدة: 450.00','إضافة عمود "سعر الوحدة" من نوع عملة',
    'لصق 48 خلية من Excel في شيت Purchases','إنهاء الفاتورة عند الصف 24',
    'تصدير Workbook كامل — 4 شيتات','استيراد ملف Excel — 120 صف',
    'حذف عمود "ملاحظات" — تأثر 2 عمود','استبدال "شاي" بـ "شاي أحمر" — 7 خلايا',
    'تعديل معادلة عمود "الإجمالي"','إنشاء Data Validation للعمود "اسم المنتج"',
    'تسجيل دخول من جهاز جديد','حفظ 34 صف في Firebase',
    'إدراج رابط في خلية A5 — Purchases','تعديل خلية C8 — القيمة: 3.25',
    'إضافة عمود "تاريخ الشراء" من نوع تاريخ','فتح الفاتورة رقم 3 — إعادة الدمج',
  ];

  const now = Date.now();
  LOG.records = Array.from({ length: 120 }, (_, i) => {
    const user   = USERS[Math.floor(Math.random() * USERS.length)];
    const action = actions[Math.floor(Math.random() * actions.length)];
    const sheet  = sheets[Math.floor(Math.random() * sheets.length)];
    const status = Math.random() > 0.08 ? 'success' : 'fail';
    return {
      id:        i + 1,
      user,
      action,
      sheet,
      details:   details[Math.floor(Math.random() * details.length)],
      device:    DEVICES[Math.floor(Math.random() * DEVICES.length)],
      timestamp: now - Math.floor(Math.random() * 30 * 24 * 3600 * 1000),
      status,
    };
  });
  LOG.records.sort((a, b) => b.timestamp - a.timestamp);
}

/* ── FILTERS ── */
function applyFilters() {
  const q      = document.getElementById('searchInput').value.toLowerCase();
  const user   = document.getElementById('filterUser').value;
  const action = document.getElementById('filterAction').value;
  const sheet  = document.getElementById('filterSheet').value;
  const status = document.getElementById('filterStatus').value;
  const date   = document.getElementById('filterDate').value;
  const now    = Date.now();

  LOG.filtered = LOG.records.filter(r => {
    if (q && ![r.user, r.action, r.details, r.sheet, r.device].join(' ').toLowerCase().includes(q)) return false;
    if (user   && r.user   !== user)   return false;
    if (action && r.action !== action) return false;
    if (sheet  && r.sheet  !== sheet)  return false;
    if (status && r.status !== status) return false;
    if (date === 'today') {
      const d = new Date(r.timestamp), t = new Date();
      if (d.toDateString() !== t.toDateString()) return false;
    } else if (date === 'week') {
      if (now - r.timestamp > 7 * 24 * 3600 * 1000) return false;
    } else if (date === 'month') {
      if (now - r.timestamp > 30 * 24 * 3600 * 1000) return false;
    }
    return true;
  });

  sortFiltered();
  LOG.page = 1;
  renderTable();
  updateStats();
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  ['filterUser','filterAction','filterSheet','filterStatus','filterDate']
    .forEach(id => document.getElementById(id).value = '');
  applyFilters();
}

/* ── SORT ── */
function sortBy(col) {
  if (LOG.sortCol === col) LOG.sortDir = LOG.sortDir === 'asc' ? 'desc' : 'asc';
  else { LOG.sortCol = col; LOG.sortDir = 'desc'; }
  document.querySelectorAll('th[id]').forEach(th => { th.classList.remove('sort-asc','sort-desc'); });
  const th = document.getElementById(`th-${col}`);
  if (th) th.classList.add(LOG.sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
  sortFiltered();
  renderTable();
}

function sortFiltered() {
  const { sortCol: col, sortDir: dir } = LOG;
  LOG.filtered.sort((a, b) => {
    let va = a[col] ?? '', vb = b[col] ?? '';
    if (col === 'timestamp') { va = +va; vb = +vb; }
    else { va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
    return dir === 'asc' ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
  });
}

/* ── RENDER ── */
function renderTable() {
  const body  = document.getElementById('logBody');
  const start = (LOG.page - 1) * LOG.perPage;
  const page  = LOG.filtered.slice(start, start + LOG.perPage);

  document.getElementById('filteredCount').textContent = LOG.filtered.length;
  document.getElementById('totalCount').textContent    = LOG.records.length;

  if (!page.length) {
    body.innerHTML = `<tr><td colspan="8"><div class="empty-state">
      <div class="es-icon">📋</div>
      <div class="es-title">لا توجد سجلات</div>
      <div class="es-text">لا توجد نتائج مطابقة لمعايير البحث الحالية</div>
    </div></td></tr>`;
    renderPagination();
    return;
  }

  body.innerHTML = page.map((r, i) => {
    const av  = AVATARS[r.user] ?? { bg:'rgba(107,142,181,0.15)', color:'#6B8EB5', initials:r.user?.slice(0,2) ?? '??' };
    const am  = ACTION_META[r.action] ?? { label: r.action, cls:'act-sys', icon:'?' };
    const sc  = SHEET_CLS[r.sheet] ?? 'chip-system';
    const dt  = new Date(r.timestamp);
    const dateFmt = dt.toLocaleDateString('ar-EG', { day:'2-digit', month:'short', year:'numeric' });
    const timeFmt = dt.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });

    return `<tr class="fade-in" onclick="openDetail(${r.id})" style="cursor:pointer">
      <td>${start + i + 1}</td>
      <td>
        <div class="td-user">
          <div class="user-avatar" style="background:${av.bg};color:${av.color}">${av.initials}</div>
          <span class="user-name">${r.user}</span>
        </div>
      </td>
      <td>
        <div class="td-action">
          <div class="action-icon ${am.cls}" style="font-size:12px">${am.icon}</div>
          <span class="${am.cls}" style="font-size:12px;padding:2px 8px;border-radius:4px">${am.label}</span>
        </div>
      </td>
      <td class="td-sheet"><span class="sheet-chip ${sc}">${r.sheet}</span></td>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx-mid);font-size:12px"
          title="${r.details}">${r.details}</td>
      <td class="td-device">${r.device.split(' / ')[0]}<br><span style="font-size:10px;color:var(--tx-lo)">${r.device.split(' / ')[1] ?? ''}</span></td>
      <td class="td-time">${timeFmt}<span class="date">${dateFmt}</span></td>
      <td>
        <span class="status-badge ${r.status === 'success' ? 'ok' : 'fail'}">
          ${r.status === 'success' ? '✓ ناجح' : '✕ فاشل'}
        </span>
      </td>
    </tr>`;
  }).join('');

  renderPagination();
}

function renderPagination() {
  const total = Math.ceil(LOG.filtered.length / LOG.perPage) || 1;
  LOG.page = Math.min(LOG.page, total);
  document.getElementById('currentPage').textContent = LOG.page;
  document.getElementById('totalPages').textContent  = total;

  const container = document.getElementById('pagBtns');
  const btns = [];

  btns.push(`<button class="pag-btn" onclick="goPage(${LOG.page - 1})" ${LOG.page === 1 ? 'disabled' : ''}>‹</button>`);

  const range = pagRange(LOG.page, total);
  let prev = null;
  for (const p of range) {
    if (prev !== null && p - prev > 1) btns.push(`<span class="pag-btn" style="border:none;color:var(--tx-lo)">…</span>`);
    btns.push(`<button class="pag-btn ${p === LOG.page ? 'active' : ''}" onclick="goPage(${p})">${p}</button>`);
    prev = p;
  }

  btns.push(`<button class="pag-btn" onclick="goPage(${LOG.page + 1})" ${LOG.page === total ? 'disabled' : ''}>›</button>`);
  container.innerHTML = btns.join('');
}

function pagRange(cur, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const r = new Set([1, total, cur - 1, cur, cur + 1].filter(p => p >= 1 && p <= total));
  return [...r].sort((a, b) => a - b);
}

function goPage(p) {
  const total = Math.ceil(LOG.filtered.length / LOG.perPage) || 1;
  if (p < 1 || p > total) return;
  LOG.page = p;
  renderTable();
  document.querySelector('.table-container').scrollTop = 0;
}

/* ── STATS ── */
function updateStats() {
  const success = LOG.filtered.filter(r => r.status === 'success').length;
  const fail    = LOG.filtered.filter(r => r.status === 'fail').length;
  const users   = new Set(LOG.filtered.map(r => r.user)).size;
  animCount('stat-total',   LOG.filtered.length);
  animCount('stat-success', success);
  animCount('stat-fail',    fail);
  animCount('stat-users',   users);
}

function animCount(id, target) {
  const el  = document.getElementById(id);
  const cur = parseInt(el.textContent) || 0;
  const diff = target - cur;
  if (diff === 0) return;
  const steps = 16;
  let i = 0;
  const t = setInterval(() => {
    i++;
    el.textContent = Math.round(cur + (diff * i / steps));
    if (i >= steps) clearInterval(t);
  }, 20);
}

/* ── DETAIL MODAL ── */
function openDetail(id) {
  const r = LOG.records.find(x => x.id === id);
  if (!r) return;
  const am = ACTION_META[r.action] ?? { label: r.action };
  const dt = new Date(r.timestamp);
  document.getElementById('detailGrid').innerHTML = `
    <div class="detail-item"><div class="di-label">المستخدم</div><div class="di-value">${r.user}</div></div>
    <div class="detail-item"><div class="di-label">العملية</div><div class="di-value">${am.label}</div></div>
    <div class="detail-item"><div class="di-label">الشيت / الصفحة</div><div class="di-value">${r.sheet}</div></div>
    <div class="detail-item"><div class="di-label">الحالة</div><div class="di-value">${r.status === 'success' ? '✓ ناجح' : '✕ فاشل'}</div></div>
    <div class="detail-item full"><div class="di-label">التفاصيل</div><div class="di-value">${r.details}</div></div>
    <div class="detail-item"><div class="di-label">الجهاز</div><div class="di-value">${r.device}</div></div>
    <div class="detail-item"><div class="di-label">التاريخ والوقت</div><div class="di-value" style="font-family:var(--f-mono);font-size:12px">${dt.toLocaleString('ar-EG')}</div></div>
    <div class="detail-item"><div class="di-label">معرف السجل</div><div class="di-value" style="font-family:var(--f-mono);font-size:11px;color:var(--tx-mid)">#${String(r.id).padStart(6,'0')}</div></div>
    <div class="detail-item"><div class="di-label">Unix Timestamp</div><div class="di-value" style="font-family:var(--f-mono);font-size:11px;color:var(--tx-mid)">${r.timestamp}</div></div>
  `;
  document.getElementById('detailModal').classList.add('open');
}

function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }

/* ── EXPORT ── */
function exportCSV() {
  const headers = ['#','المستخدم','العملية','الشيت','التفاصيل','الجهاز','التاريخ والوقت','الحالة'];
  const rows = LOG.filtered.map((r, i) => [
    i + 1, r.user,
    ACTION_META[r.action]?.label ?? r.action,
    r.sheet, r.details, r.device,
    new Date(r.timestamp).toLocaleString('ar-EG'),
    r.status === 'success' ? 'ناجح' : 'فاشل',
  ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));

  const csv  = '\uFEFF' + [headers.join(','), ...rows].join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
  download(blob, `activity_log_${Date.now()}.csv`);
  toast('تم تصدير CSV', 'success');
}

function exportJSON() {
  const data = LOG.filtered.map(r => ({
    id: r.id, user: r.user,
    action: ACTION_META[r.action]?.label ?? r.action,
    sheet: r.sheet, details: r.details, device: r.device,
    timestamp: new Date(r.timestamp).toISOString(), status: r.status,
  }));
  download(new Blob([JSON.stringify(data, null, 2)], { type:'application/json' }), `activity_log_${Date.now()}.json`);
  toast('تم تصدير JSON', 'success');
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ── REFRESH ── */
function refreshLog() {
  seedData();
  applyFilters();
  toast('تم تحديث السجل', 'info');
}

/* ── TOAST ── */
function toast(msg, type = 'info') {
  const icons = { success:'✓', error:'✕', info:'ℹ', warn:'⚠' };
  const host  = document.getElementById('toastHost');
  const el    = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(() => el.remove(),300); }, 3000);
}

/* ── INIT ── */
window.addEventListener('DOMContentLoaded', () => {
  // Populate user filter
  const sel = document.getElementById('filterUser');
  USERS.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u; opt.textContent = u;
    sel.appendChild(opt);
  });

  seedData();
  LOG.filtered = [...LOG.records];
  sortFiltered();
  renderTable();
  updateStats();

  // Default sort indicator
  document.getElementById('th-timestamp').classList.add('sort-desc');

  // ESC closes modal
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDetail();
  });
  document.getElementById('detailModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeDetail();
  });
});
</script>
